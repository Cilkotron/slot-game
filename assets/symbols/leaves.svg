<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="leaf" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#8BE83F"/>
      <stop offset="35%" stop-color="#4FBE2F"/>
      <stop offset="70%" stop-color="#24952A"/>
      <stop offset="100%" stop-color="#126B25"/>
    </linearGradient>

    <linearGradient id="vein" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8F04B"/>
      <stop offset="100%" stop-color="#D0F76A"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="1"
        dy="2"
        stdDeviation="1.5"
        flood-color="#174D1D"
        flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Leaf -->
  <path
    d="
      M 25 108
      C 32 94, 36 79, 39 65
      C 43 46, 56 27, 101 14
      C 98 34, 93 55, 82 72
      C 69 92, 50 103, 25 108
      Z
    "
    fill="url(#leaf)"
    stroke="#247C28"
    stroke-width="1"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Main vein -->
  <path
    d="M 25 108
       C 45 88, 63 65, 101 14"
    fill="none"
    stroke="url(#vein)"
    stroke-width="2"
    stroke-linecap="round"
  />

  <!-- Left side veins -->
  <g
    fill="none"
    stroke="#8FE44A"
    stroke-width="0.9"
    stroke-linecap="round"
    opacity="0.9">

    <path d="M 37 91 C 39 82, 37 74, 34 67"/>
    <path d="M 45 82 C 47 72, 45 62, 41 55"/>
    <path d="M 54 71 C 57 61, 56 51, 51 43"/>
    <path d="M 64 59 C 68 49, 68 40, 63 33"/>
    <path d="M 75 46 C 79 38, 80 31, 77 26"/>
  </g>

  <!-- Right side veins -->
  <g
    fill="none"
    stroke="#73D83C"
    stroke-width="0.85"
    stroke-linecap="round"
    opacity="0.85">

    <path d="M 38 94 C 51 92, 61 87, 69 80"/>
    <path d="M 46 83 C 59 81, 69 76, 77 69"/>
    <path d="M 55 71 C 68 69, 78 64, 85 57"/>
    <path d="M 65 58 C 77 56, 86 51, 91 45"/>
    <path d="M 76 45 C 86 43, 93 38, 96 33"/>
  </g>

  <!-- Small stem -->
  <path
    d="M 25 108 C 22 111, 21 114, 23 116"
    fill="none"
    stroke="#2C8D27"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>