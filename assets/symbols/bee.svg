<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="beeBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </radialGradient>
    <radialGradient id="wingGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E0FFFF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:0.4"/>
    </radialGradient>
  </defs>
  <!-- Wings -->
  <ellipse cx="42" cy="48" rx="22" ry="16" fill="url(#wingGrad)" transform="rotate(-20 42 48)"/>
  <ellipse cx="86" cy="48" rx="22" ry="16" fill="url(#wingGrad)" transform="rotate(20 86 48)"/>
  <!-- Body -->
  <ellipse cx="64" cy="64" rx="28" ry="22" fill="url(#beeBody)"/>
  <!-- Stripes -->
  <rect x="48" y="46" width="6" height="44" fill="#000" rx="2"/>
  <rect x="61" y="46" width="6" height="44" fill="#000" rx="2"/>
  <rect x="74" y="46" width="6" height="44" fill="#000" rx="2"/>
  <!-- Head -->
  <circle cx="64" cy="42" r="14" fill="#000"/>
  <!-- Eyes -->
  <circle cx="58" cy="40" r="5" fill="#87CEEB"/>
  <circle cx="70" cy="40" r="5" fill="#87CEEB"/>
  <circle cx="58" cy="40" r="2.5" fill="#000"/>
  <circle cx="70" cy="40" r="2.5" fill="#000"/>
  <!-- Antennae -->
  <path d="M58 36 Q 50 26 48 21" stroke="#000" stroke-width="2.5" fill="none"/>
  <path d="M70 36 Q 80 26 80 21" stroke="#000" stroke-width="2.5" fill="none"/>
  <circle cx="48" cy="21" r="3" fill="#000"/>
  <circle cx="80" cy="21" r="3" fill="#000"/>
  <!-- Stinger -->
  <path d="M64 82 L 64 95" stroke="#000" stroke-width="3"/>
  <path d="M60 95 L 64 100 L 68 95" fill="#000"/>
  <!-- Legs -->
  <line x1="52" y1="60" x2="40" y2="64" stroke="#000" stroke-width="2.5"/>
  <line x1="52" y1="68" x2="40" y2="72" stroke="#000" stroke-width="2.5"/>
  <line x1="76" y1="60" x2="88" y2="64" stroke="#000" stroke-width="2.5"/>
  <!-- <line x1="76" y1="68" x2="88 y2="72" stroke="#000" stroke-width="2.5"/> -->
</svg>