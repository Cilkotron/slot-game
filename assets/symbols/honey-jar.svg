<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="jarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#DAA520"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CD853F"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </linearGradient>
  </defs>
  <!-- Lid -->
  <rect x="35" y="28" width="58" height="16" fill="url(#lidGrad)" rx="3"/>
  <rect x="35" y="42" width="58" height="5" fill="#8B4513" rx="2"/>
  <!-- Jar body -->
  <ellipse cx="64" cy="48" rx="32" ry="10" fill="#B8860B"/>
  <rect x="32" y="48" width="64" height="54" fill="url(#jarGrad)" rx="6"/>
  <ellipse cx="64" cy="102" rx="32" ry="10" fill="#B8860B"/>
  <!-- Jar outline -->
  <rect x="32" y="48" width="64" height="54" fill="none" stroke="#8B4513" stroke-width="3" rx="6"/>
  <!-- Honeycomb pattern -->
  <polygon points="45,62 52,62 48.5,74" fill="#FFA500"/>
  <polygon points="58,62 64,62 61,74" fill="#FFA500"/>
  <polygon points="70,62 76,62 73,74" fill="#FFA500"/>
  <polygon points="52,75 58,75 55,87" fill="#FFA500"/>
  <polygon points="64,75 70,75 67,87" fill="#FFA500"/>
  <polygon points="48,88 54,88 51,100" fill="#FFA500"/>
  <polygon points="60,88 66,88 63,100" fill="#FFA500"/>
  <polygon points="72,88 78,88 75,100" fill="#FFA500"/>
  <!-- Honey drips -->
  <ellipse cx="48" cy="97" rx="5" ry="8" fill="#FFA500" opacity="0.7"/>
  <ellipse cx="73" cy="99" rx="4" ry="7" fill="#FFA500" opacity="0.7"/>
  <ellipse cx="60" cy="100" rx="4.5" ry="7" fill="#FFA500" opacity="0.7"/>
  <!-- Highlight -->
  <ellipse cx="45" cy="56" rx="5" ry="10" fill="#FFEC8B" opacity="0.5"/>
