<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Fruit Basket</title>

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- PixiJS v8 -->
        <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>

        <!-- Custom Styles -->
        <link rel="stylesheet" href="./css/styles.css" />
    </head>

    <body class="text-white">
        <div class="min-h-dvh w-full bg-gradient-to-b from-slate-950 via-slate-950 to-black">
            <main class="w-full max-w-[1050px] mx-auto px-2 sm:px-4 py-2 sm:py-3">
                <!-- HEADER -->
                <header class="game-header text-center mb-2 sm:mb-3">
                    <h1 class="text-3xl sm:text-5xl font-black leading-none text-yellow-400">
                        FRUIT 🧺
                    </h1>
                    <div class="mt-1 text-[9px] sm:text-[11px] tracking-[0.45em] text-slate-400">
                        PIXIJS HTML5 SLOT
                    </div>
                </header>

                <!-- GAME MACHINE -->
                <section
                    class="w-full rounded-2xl border-[3px] sm:border-4 border-yellow-500 bg-black/70 p-2 sm:p-3 shadow-2xl"
                >
                    <!-- REELS CANVAS -->
                    <div
                        id="gameCanvas"
                        class="w-full aspect-[5/3] max-h-[58dvh] mx-auto overflow-hidden rounded-xl bg-black"
                    ></div>

                    <!-- HUD -->
                    <div class="mt-2 grid grid-cols-4 gap-1.5 sm:gap-2">
                        <div
                            class="min-w-0 rounded-lg border border-slate-700 bg-slate-900 py-1.5 sm:py-2 text-center"
                        >
                            <div class="text-[8px] sm:text-[10px] text-slate-400">BALANCE</div>
                            <div
                                id="balance"
                                class="truncate text-base sm:text-xl font-black text-yellow-400"
                            >
                                1000
                            </div>
                        </div>

                        <div
                            class="min-w-0 rounded-lg border border-slate-700 bg-slate-900 py-1.5 sm:py-2 text-center"
                        >
                            <div class="text-[8px] sm:text-[10px] text-slate-400">BET</div>
                            <div
                                id="bet"
                                class="truncate text-base sm:text-xl font-black text-yellow-400"
                            >
                                10
                            </div>
                        </div>

                        <div
                            class="min-w-0 rounded-lg border border-slate-700 bg-slate-900 py-1.5 sm:py-2 text-center"
                        >
                            <div class="text-[8px] sm:text-[10px] text-slate-400">WIN</div>
                            <div
                                id="win"
                                class="truncate text-base sm:text-xl font-black text-green-400"
                            >
                                0
                            </div>
                        </div>

                        <div
                            class="min-w-0 rounded-lg border border-slate-700 bg-slate-900 py-1.5 sm:py-2 text-center"
                        >
                            <div class="text-[8px] sm:text-[10px] text-slate-400">FREE SPINS</div>
                            <div
                                id="freeSpins"
                                class="truncate text-base sm:text-xl font-black text-cyan-400"
                            >
                                0
                            </div>
                        </div>
                    </div>

                    <!-- CONTROLS -->
                    <div
                        class="mt-2 grid grid-cols-[auto_auto_minmax(110px,180px)_auto_auto] items-center justify-center gap-1.5 sm:gap-3"
                    >
                        <button
                            id="paytableButton"
                            type="button"
                            class="h-9 sm:h-11 px-2 sm:px-4 rounded-full border border-slate-600 bg-slate-800 hover:bg-slate-700 text-[9px] sm:text-xs font-bold"
                        >
                            PAY
                        </button>

                        <button
                            id="betDown"
                            type="button"
                            class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-xl font-black"
                        >
                            −
                        </button>

                        <button
                            id="spin"
                            type="button"
                            class="h-12 sm:h-14 px-5 rounded-full border-2 border-yellow-200 bg-gradient-to-b from-yellow-300 via-yellow-400 to-orange-500 text-black text-lg sm:text-xl font-black shadow-lg hover:scale-[1.03] active:scale-95 disabled:opacity-40 transition"
                        >
                            SPIN
                        </button>

                        <button
                            id="betUp"
                            type="button"
                            class="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-xl font-black"
                        >
                            +
                        </button>

                        <button
                            id="maxBetButton"
                            type="button"
                            class="h-9 sm:h-11 px-2 sm:px-4 rounded-full border border-slate-600 bg-slate-800 hover:bg-slate-700 text-[9px] sm:text-xs font-bold"
                        >
                            MAX
                        </button>
                    </div>

                    <!-- AUDIO CONTROLS -->
                    <div class="mt-2 flex justify-center gap-2">
                        <button
                            id="musicToggle"
                            type="button"
                            class="h-8 px-3 rounded-full border border-slate-600 bg-slate-800 hover:bg-slate-700 text-[8px] sm:text-[10px] font-bold"
                        >
                            🎵 MUSIC
                        </button>
                        <button
                            id="muteToggle"
                            type="button"
                            class="h-8 px-3 rounded-full border border-slate-600 bg-slate-800 hover:bg-slate-700 text-[8px] sm:text-[10px] font-bold"
                        >
                            🔊 SOUND
                        </button>
                    </div>

                    <!-- MESSAGE -->
                    <div
                        id="message"
                        class="mt-1.5 min-h-6 flex items-center justify-center text-center text-xs sm:text-base font-black text-yellow-300"
                    >
                        PRESS SPIN
                    </div>
                </section>
            </main>
        </div>

        <script type="module" src="./game.js"></script>
    </body>
</html>
